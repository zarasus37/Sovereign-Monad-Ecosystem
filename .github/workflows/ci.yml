name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Fast layout + drift gate. Mirrors the wired `pnpm check:*` script entries
  # in package.json. Fails fast on top-level hygiene and contract drift before
  # the heavier jobs run.
  # ─────────────────────────────────────────────────────────────────────────
  layout-and-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Layout check
        run: pnpm check:layout

  # ─────────────────────────────────────────────────────────────────────────
  # Full aggregate: pnpm check:layout && pnpm check:numerics && ...
  # && pnpm test:integration. This is the canonical "is this PR safe to
  # merge?" gate — the same chain a developer runs locally as `pnpm validate`.
  #
  # Layer 6 schedule-schema drift (εP/ζF, terms P/F) was fixed in schema +
  # runtime; `pnpm check:schedule-schema` is green. Keep validate required.
  # ─────────────────────────────────────────────────────────────────────────
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # test:integration includes TS<->Python parity tests
      # (classifier-parity, scorer-parity, tier-parity). They shell out to
      # `uv run --project gnostic-engine python ...`, so the runner needs uv.
      # Without it the three suites fail with `spawnSync uv ENOENT`.
      # uv downloads the interpreter gnostic-engine's requires-python asks for.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Aggregate validate (layout + drift + typecheck + integration)
        run: pnpm validate
